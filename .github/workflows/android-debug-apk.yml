name: Build Android Debug APK

# Uses the Android SDK preinstalled on the GitHub-hosted ubuntu-24.04 image
# instead of android-actions/setup-android (whose default `tools` package is
# no longer served by Google). Hosted runner images are still updated by
# GitHub, so this is not a fully hermetic build; the required SDK packages
# are installed and verified explicitly below.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CI: "true"
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: 36.0.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Locate Android sdkmanager
        shell: bash
        run: |
          set -euo pipefail

          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          if [[ ! -d "$ANDROID_HOME" ]]; then
            echo "::error::ANDROID_HOME ($ANDROID_HOME) does not exist"
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found at $SDKMANAGER; falling back to PATH lookup"
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found in \$ANDROID_HOME/cmdline-tools/latest/bin or on PATH"
            exit 1
          fi

          SDKMANAGER="$(readlink -f "$SDKMANAGER")"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$SDKMANAGER"

      - name: Log toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          java -version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --version

          # Vite 8 / @capacitor/cli 8 require Node >= 22.12 on the 22.x line.
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 22 || (major === 22 && minor < 12)) {
              console.error("::error::Node " + process.versions.node + " is too old; >= 22.12 is required");
              process.exit(1);
            }
          '

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail

          # `yes` is killed by SIGPIPE once sdkmanager stops reading, which
          # would fail the pipeline under pipefail. Disable pipefail only for
          # this pipeline so its status is sdkmanager's own exit code; set -e
          # still aborts the step if sdkmanager fails.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > "$RUNNER_TEMP/sdk-licenses.log" 2>&1 || {
            status=$?
            tail -n 50 "$RUNNER_TEMP/sdk-licenses.log"
            echo "::error::sdkmanager --licenses failed with exit code $status"
            exit "$status"
          }
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS"

          test -f "$ANDROID_HOME/platforms/$ANDROID_PLATFORM/android.jar" \
            || { echo "::error::android.jar missing for $ANDROID_PLATFORM"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2" \
            || { echo "::error::aapt2 missing for build-tools $ANDROID_BUILD_TOOLS"; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npx --no-install tsc --noEmit

      - name: Build web app and sync Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          npm run build:mobile
          test -f android/app/src/main/assets/public/index.html \
            || { echo "::error::Web assets were not copied into the Android project"; exit 1; }
          test -f android/app/src/main/assets/capacitor.config.json \
            || { echo "::error::Capacitor sync did not generate capacitor.config.json"; exit 1; }

      - name: Build, unit test and lint Android debug variant
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
